name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build and Release both Windows and Linux versions. Leave blank to only build and NOT release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: fella.exe
            artifact_name: fella-windows-x86_64
          - os: ubuntu-latest
            artifact: fella
            artifact_name: fella-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm fella.spec
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename platform assets
        run: |
          mv artifacts/fella-windows-x86_64/fella.exe artifacts/fella-windows-x86_64.exe
          mv artifacts/fella-linux-x86_64/fella artifacts/fella-linux-x86_64.elf
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/fella-windows-x86_64.exe
            artifacts/fella-linux-x86_64.elf
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
