[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fella"
version = "0.1.0"
description = "A small, sliding desktop pet."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["fella", "fella.behavior", "fella.tracking", "fella.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:ruff"
